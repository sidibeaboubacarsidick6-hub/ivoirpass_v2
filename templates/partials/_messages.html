{% if messages %}
<div class="container mt-3" id="django-messages">
  {% for message in messages %}
  <div class="alert ip-alert alert-{{ message.tags }} alert-dismissible fade show"
       role="alert"
       {% if 'kyc-persistent' not in message.tags %}data-auto-dismiss{% endif %}>
    {% if 'success' in message.tags %}
      <i class="bi bi-check-circle-fill me-2"></i>
    {% elif 'error' in message.tags or 'danger' in message.tags %}
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
    {% elif 'warning' in message.tags %}
      <i class="bi bi-exclamation-circle-fill me-2"></i>
    {% else %}
      <i class="bi bi-info-circle-fill me-2"></i>
    {% endif %}
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
