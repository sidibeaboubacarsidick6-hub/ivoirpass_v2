{% extends 'base.html' %}
{% block title %}Accès invalide{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">

      <div class="ip-card p-5 text-center">

        <div style="width:80px; height:80px; border-radius:50%;
                    background:#fdf0f0;
                    display:flex; align-items:center; justify-content:center;
                    margin:0 auto 1.5rem; font-size:2.2rem;">
          ⚠️
        </div>

        <h3 class="fw-bold mb-2">Accès impossible</h3>
        <p class="text-muted mb-4">{{ reason }}</p>

        {% if event %}
        <p class="text-muted small mb-4">
          Événement : <strong>{{ event.title }}</strong>
        </p>
        {% endif %}

        <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">
          <i class="bi bi-house me-1"></i>Retour à l'accueil
        </a>

      </div>

    </div>
  </div>
</div>
{% endblock %}
